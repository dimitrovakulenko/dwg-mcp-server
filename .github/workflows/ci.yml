name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Rust build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev libxml2-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare prebuilt LibreDWG
        run: bash scripts/use-libredwg-prebuilt.sh x86_64-unknown-linux-gnu "${{ github.workspace }}/.cache/libredwg-root"

      - name: Cargo test (workspace)
        env:
          LIBREDWG_ROOT_DIR: ${{ github.workspace }}/.cache/libredwg-root
          LIBREDWG_SOURCE_ROOT: ${{ github.workspace }}/.cache/libredwg-root/src
        run: cargo test --workspace

      - name: Build dwg-worker binary for Python tests
        env:
          LIBREDWG_ROOT_DIR: ${{ github.workspace }}/.cache/libredwg-root
          LIBREDWG_SOURCE_ROOT: ${{ github.workspace }}/.cache/libredwg-root/src
        run: cargo build -p dwg-worker

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python package (MCP host + deps)
        run: python3 -m pip install --user "./server"

      - name: Python integration tests (excludes Docker-only tests)
        env:
          DWG_WORKER_BIN: ${{ github.workspace }}/target/debug/dwg-worker
          LIBREDWG_SOURCE_ROOT: ${{ github.workspace }}/.cache/libredwg-root/src
          PYTHONPATH: ${{ github.workspace }}/server/src
        run: |
          python3 -m unittest \
            server.tests.test_file_access \
            server.tests.test_host \
            server.tests.test_mcp_stdio \
            -v
