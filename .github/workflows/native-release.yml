name: Native Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - linux-x64
          - linux-arm64
          - macos-arm64
          - windows-x64

permissions:
  contents: read

jobs:
  select:
    name: Select platforms
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Build matrix
        id: matrix
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          case "$PLATFORM" in
            all) matrix='{"include":[{"platform":"linux-x64","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","executable_suffix":""},{"platform":"linux-arm64","os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","executable_suffix":""},{"platform":"macos-arm64","os":"macos-15","target":"aarch64-apple-darwin","executable_suffix":""},{"platform":"windows-x64","os":"windows-2025","target":"x86_64-pc-windows-gnu","executable_suffix":".exe"}]}' ;;
            linux-x64) matrix='{"include":[{"platform":"linux-x64","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","executable_suffix":""}]}' ;;
            linux-arm64) matrix='{"include":[{"platform":"linux-arm64","os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","executable_suffix":""}]}' ;;
            macos-arm64) matrix='{"include":[{"platform":"macos-arm64","os":"macos-15","target":"aarch64-apple-darwin","executable_suffix":""}]}' ;;
            windows-x64) matrix='{"include":[{"platform":"windows-x64","os":"windows-2025","target":"x86_64-pc-windows-gnu","executable_suffix":".exe"}]}' ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Resolve LibreDWG revision
        id: libredwg
        shell: bash
        run: echo "sha=$(git -C third_party/libredwg rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        shell: bash
        run: |
          version=$(node -p "require('./npm/package.json').version")
          server_version=$(node -p "require('./server.json').version")
          if [[ "$version" != "$server_version" ]]; then
            echo "npm version ${version} does not match server.json version ${server_version}" >&2
            exit 1
          fi
          if [[ "${{ github.ref_type }}" == "tag" && "v${version}" != "${{ github.ref_name }}" ]]; then
            echo "Tag ${{ github.ref_name }} does not match npm package version ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison build-essential clang flex libclang-dev libtool make pkg-config texinfo

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool bison flex

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            autoconf automake bison flex libtool make mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf texinfo

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore LibreDWG cache
        id: libredwg-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            third_party/libredwg/src/.libs/libredwg.a
            third_party/libredwg/src/config.h
          key: libredwg-v1-${{ runner.os }}-${{ matrix.target }}-${{ steps.libredwg.outputs.sha }}-${{ hashFiles('scripts/build-libredwg.sh') }}

      - name: Build LibreDWG (Unix)
        if: steps.libredwg-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: bash scripts/build-libredwg.sh

      - name: Build LibreDWG (Windows)
        if: steps.libredwg-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-libredwg.sh

      - name: Save LibreDWG cache
        if: steps.libredwg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            third_party/libredwg/src/.libs/libredwg.a
            third_party/libredwg/src/config.h
          key: libredwg-v1-${{ runner.os }}-${{ matrix.target }}-${{ steps.libredwg.outputs.sha }}-${{ hashFiles('scripts/build-libredwg.sh') }}

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/${{ matrix.target }}
          key: cargo-release-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
            cargo-v1-${{ runner.os }}-${{ matrix.target }}-

      - name: Build and test Rust (Unix)
        if: runner.os != 'Windows'
        env:
          LIBREDWG_SOURCE_ROOT: ${{ github.workspace }}/third_party/libredwg/src
        run: |
          cargo test --workspace --target "${{ matrix.target }}"
          cargo build -p dwg-worker --release --target "${{ matrix.target }}"

      - name: Build and test Rust (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc-ar
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          LIBREDWG_SOURCE_ROOT: ${{ github.workspace }}/third_party/libredwg/src
        run: |
          cargo test --workspace --target "${{ matrix.target }}"
          cargo build -p dwg-worker --release --target "${{ matrix.target }}"

      - name: Install Python packaging dependencies
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Build standalone MCP host
        shell: bash
        run: |
          python -m pip install ./server pyinstaller
          python -m PyInstaller --clean --noconfirm --onedir \
            --name dwg-mcp-server \
            --paths server/src \
            packaging/native_entry.py

      - name: Assemble native archive
        shell: bash
        run: |
          bundle="dist/dwg-mcp-server"
          cp "target/${{ matrix.target }}/release/dwg-worker${{ matrix.executable_suffix }}" "$bundle/"
          mkdir -p "$bundle/libredwg"
          cp third_party/libredwg/src/classes.c third_party/libredwg/src/dynapi.c "$bundle/libredwg/"
          cp LICENSE README.md "$bundle/"
          archive="dwg-mcp-server-${VERSION}-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C dist dwg-mcp-server
          python -c "import hashlib, pathlib; p=pathlib.Path('$archive'); pathlib.Path('$archive.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest() + '\n')"

      - name: Smoke test standalone host
        shell: bash
        run: |
          mkdir smoke
          tar -xzf "dwg-mcp-server-${VERSION}-${{ matrix.target }}.tar.gz" -C smoke
          python scripts/smoke-native-package.py smoke/dwg-mcp-server/dwg-mcp-server${{ matrix.executable_suffix }}

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            dwg-mcp-server-${{ env.VERSION }}-${{ matrix.target }}.tar.gz
            dwg-mcp-server-${{ env.VERSION }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" artifacts/* --clobber
          else
            gh release create "${{ github.ref_name }}" artifacts/* --generate-notes --verify-tag
          fi

  publish-npm:
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Publish npm launcher
        working-directory: npm
        run: |
          npm install --global npm@latest
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          npm view "${name}@${version}" version >/dev/null 2>&1 || npm publish
