[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dwg-mcp-server"
version = "0.2.3"
description = "DWG file format access for AI via MCP"
keywords = ["mcp", "dwg", "dwg-format", "ai-agents", "file-format"]
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.26.0,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
