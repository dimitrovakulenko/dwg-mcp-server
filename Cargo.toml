[workspace]
members = [
    "crates/dwg-libredwg",
    "crates/dwg-render-core",
    "crates/dwg-worker",
    "crates/dwg-worker-core",
]
exclude = ["crates/libredwg-sys"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
base64 = "0.22.1"
regex = "1.12.2"
resvg = "0.47.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
